generated: '2026-07-19'
method: searched
status: third-party
status_raw: community
source: https://github.com/cfrs2005/mcp-gs-robot
note: >-
  No first-party Gausium-hosted MCP server was found. The substantive MCP server
  for the Gausium Cloud Open API is a community project (cfrs2005/mcp-gs-robot),
  published on PyPI as mcp-gs-robot and hosted on Smithery. It wraps the Gausium
  robot OpenAPI (openapi.gs-robot.com) and authenticates with the developer's own
  GS_CLIENT_ID / GS_CLIENT_SECRET / GS_OPEN_ACCESS_KEY credentials. Separately,
  the Gausium marketing site (gaussianrobotics.com) exposes a generic Wix Site
  MCP endpoint for public site-content queries (no auth), unrelated to robot
  control.
servers:
- name: mcp-gs-robot
  official: false
  transport: stdio
  package: mcp-gs-robot
  registry: pypi
  package_url: https://pypi.org/project/mcp-gs-robot/
  repo: https://github.com/cfrs2005/mcp-gs-robot
  smithery: https://smithery.ai/server/@cfrs2005/mcp-gs-robot
  auth_env: [GS_CLIENT_ID, GS_CLIENT_SECRET, GS_OPEN_ACCESS_KEY]
  wraps_api: https://openapi.gs-robot.com
  tools:
  - name: list_robots
    description: List robots bound to the account
    source_operation: GET /v1alpha1/robots
  - name: get_robot_status
    description: Get current status for a robot
  - name: get_robot_status_smart
    description: Status query routed by robot series (V1/V2)
  - name: list_robot_task_reports
    description: List task reports for a robot
  - name: get_task_reports_smart
    description: Task-report query routed by robot series (V1/V2)
  - name: list_robot_maps
    description: List maps used by a robot
  - name: get_map_subareas
    description: Retrieve subarea information within a robot map
  - name: create_robot_command
    description: Issue a command to a robot
  - name: submit_temp_task
    description: Dispatch a temporary cleaning task
  - name: get_site_info
    description: Retrieve site information
  - name: get_robot_capabilities
    description: Retrieve capabilities of a robot
- name: gaussianrobotics-site-mcp
  official: true
  transport: http
  url: https://www.gaussianrobotics.com/_api/mcp
  auth: none
  description: >-
    Wix-generated Site MCP for public marketing-site content (business details,
    site search, API docs). Not the robot-control API.
  source: https://www.gaussianrobotics.com/llms.txt
