name: Gaussian Robotics
description: 'Gaussian Robotics (Gausium) is an autonomous cleaning and service robotics
  company founded in 2013 and headquartered in Shanghai, with more than 6,500 customers
  across 70+ countries. Its commercial floor-care and delivery robots (Scrubber 50/75,
  Phantas, Beetle, Omnie, Vacuum 40) are built on AI, 3D LiDAR and SLAM navigation.
  Gausium publishes a public developer platform and the Gausium Cloud Open API
  (openapi.gs-robot.com), a REST API secured with OAuth 2.0 bearer tokens that lets
  facilities and partners list robots, query robot status and task reports, retrieve
  maps and subareas, issue robot commands, dispatch temporary cleaning tasks, and
  integrate the fleet with building IoT and elevator-control systems.'
